name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build WPF app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Xbox360DeploymentToolkit.sln --configfile NuGet.Config

      - name: Test
        run: dotnet test Xbox360DeploymentToolkit.sln --configuration Release --no-restore

      - name: Publish Windows x64 app
        run: dotnet publish src/Xbox360DeploymentToolkit/Xbox360DeploymentToolkit.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/Xbox360-Deployment-Toolkit
